  name: Discord Build Notification

  on:
    workflow_run:
      workflows: ["LabyAddon Build"]
      types:
        - completed

  jobs:
    notify:
      if: ${{ github.event.workflow_run.conclusion == 'success' }}
      runs-on: ubuntu-latest

      permissions:
        actions: read

      steps:
        - name: Create Download Link
          id: download
          env:
            BUILD_ID: ${{ steps.artifact.outputs.build_id }}
            REPOSITORY: ${{ github.event.repository.name }}
            RUN_ID: ${{ github.event.workflow_run.id }}
          run: |
            DOWNLOAD_URL="https://github.com/LabyAddons/${REPOSITORY}/actions/runs/$RUN_ID/artifacts/$BUILD_ID"
            echo "url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"

        - name: Send Discord Webhook
          env:
            DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
            DOWNLOAD_URL: ${{ steps.download.outputs.url }}
          run: |
            curl -H "Content-Type: application/json" \
              -X POST \
              -d "{
                \"username\": \"LabyAddon Build\",
                \"embeds\": [{
                  \"title\": \"✅ LabyAddon Build erfolgreich\",
                  \"description\": \"Ein neuer Build wurde erfolgreich erstellt.\",
                  \"color\": 5763719,
                  \"fields\": [
                    {
                      \"name\": \"📦 Download\",
                      \"value\": \"[**⬇️ Artifact herunterladen**]($DOWNLOAD_URL)\",
                      \"inline\": false
                    },
                    {
                      \"name\": \"📁 Repository\",
                      \"value\": \"`${REPOSITORY}`\",
                      \"inline\": true
                    },
                    {
                      \"name\": \"🔢 Build\",
                      \"value\": \"#${{ github.event.workflow_run.run_number }}\",
                      \"inline\": true
                    }
                  ],
                  \"footer\": {
                    \"text\": \"GitHub Actions • LabyAddon\"
                  }
                }]
              }" \
              "$DISCORD_WEBHOOK"