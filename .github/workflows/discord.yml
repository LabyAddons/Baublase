
  name: Discord Build Notification

  on:
    workflow_run:
      workflows: ["LabyAddon Build"]
      types:
        - completed

  jobs:
    notify:
      if: ${{ github.event.workflow_run.conclusion == 'success' }}
      runs-on: ubuntu-latest

      permissions:
        actions: read

      steps:
        - name: Get Artifact
          id: artifact
          env:
            GH_TOKEN: ${{ github.token }}
            RUN_ID: ${{ github.event.workflow_run.id }}
          run: |
            BUILD_ID=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
              | jq -r '.artifacts[] | select(.name == "Artifacts") | .id')
            
            echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

        - name: Send Discord Webhook
          env:
            DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
            REPOSITORY: ${{ github.event.repository.name }}
            RUN_ID: ${{ github.event.workflow_run.id }}
            BUILD_ID: ${{ steps.artifact.outputs.build_id }}
          run: |
            DOWNLOAD_URL="https://github.com/LabyAddons/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts/${BUILD_ID}"
            
            curl -H "Content-Type: application/json" \
              -X POST \
              -d "{
                \"username\": \"LabyAddon Build\",
                \"embeds\": [{
                  \"title\": \"✅ LabyAddon Build erfolgreich\",
                  \"description\": \"Ein neuer Build wurde erfolgreich erstellt.\",
                  \"color\": 5763719,
                  \"fields\": [
                    {
                      \"name\": \"📦 Download\",
                      \"value\": \"[**⬇️ Artifact herunterladen**]($DOWNLOAD_URL)\",
                      \"inline\": false
                    },
                    {
                      \"name\": \"📁 Repository\",
                      \"value\": \"`${REPOSITORY}`\",
                      \"inline\": true
                    },
                    {
                      \"name\": \"🔢 Build\",
                      \"value\": \"#${{ github.event.workflow_run.run_number }}\",
                      \"inline\": true
                    }
                  ],
                  \"footer\": {
                    \"text\": \"GitHub Actions • LabyAddon\"
                  }
                }]
              }" \
              "$DISCORD_WEBHOOK"